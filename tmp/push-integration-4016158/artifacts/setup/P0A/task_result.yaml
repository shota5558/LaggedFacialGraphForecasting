migration:
  from_schema_version: 3
  to_schema_version: 4
  reason: >-
    Primary PCMCI+ pc_alpha has been explicitly fixed to 0.01. Because pc_alpha is
    a scientific discovery parameter, the machine-readable Scientific Freeze was
    migrated to schema v4 and exact-value validation now rejects numeric drift,
    null/model-selection mode, or unreviewed configuration extensions.
  impact_scope:
    - configs/scientific_freeze.yaml
    - schemas/scientific_freeze.schema.json
    - scientific_config loader
    - D-05 pc_alpha contract
    - downstream PCMCI+ execution configuration
  migration_rule: >-
    Primary runs created under Scientific Freeze v3 are not considered fully frozen
    for discovery execution until migrated to v4 with pc_alpha=0.01.

