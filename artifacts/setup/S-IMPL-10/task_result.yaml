task_name: Primary Freeze execution barrier
status: PASS

audit_remediation:
  issue: 22
  prior_audit_verdict: FAIL
  root_cause: >-
    The Primary Freeze validator existed and passed unit tests, but phase shuffle,
    circular shift, multi-horizon construction, GRU fit/predict, and raw Sensitivity
    result serialization could be invoked without making the common execution barrier
    structurally mandatory at their public entrypoints.
  issue_reopened_before_fix: true
  remediation_commits:
    - bef72dbe08ea23d9ef852b003bc60d52899f73c7
    - cd95c7bd9cc686a121c461c34b7c5bc91ca9ffb7
    - 84b2700947786241160046c56c0c32589f156a1d

implemented:
  - real-data Sensitivity execution fails closed when Primary Freeze manifest is absent
  - existence-only, invalid, incomplete, or hash-mismatched Primary Freeze manifests are rejected
  - Primary Freeze manifest must declare PASS and use artifacts/primary as its root
  - all Issue #20 freeze target artifact types are required and SHA-256 verified
  - GPDC and LPCMCI retain their execution-boundary and outer-train leakage guards
  - phase-shuffle public execution APIs require SensitivityExperimentConfig and the common barrier
  - circular-shift public execution APIs require SensitivityExperimentConfig and the common barrier
  - all h>1 Sensitivity design-matrix builders require SensitivityExperimentConfig and the common barrier
  - GRU fit and predict public APIs require SensitivityExperimentConfig and the common barrier
  - real Sensitivity artifact provenance must reference the exact canonical Primary Freeze manifest
  - raw Sensitivity result serialization requires an execution permit and validates real provenance
  - canonical Sensitivity result writing is confined to artifacts/sensitivity
  - synthetic pre-implementation remains executable without Primary Freeze
  - Primary h=1, PCMCI+/ParCorr, Ridge, Core contracts, and Primary artifact namespace are unchanged

