fail_history:
  initial_status: FAIL
  fail_types:
    - contract mismatch
    - scientific specification conflict
  root_cause: >-
    The pre-v2 PCMCI DesignMatrix expanded every selected source region into all
    dimensions, while Scientific Freeze v2 defines discovery nodes as
    region_dimension and forecasting_feature_rule as exact_selected_component.
    This discarded component-specific selection semantics.
  minimal_fix: >-
    Construct one scalar target component at a time, retain only ParentLinks for
    that target component, and add only each retained source component at its
    selected lag while preserving the same fixed Self-history block.
  regression_fix: >-
    Four old tests still instantiated ambiguous region-only ParentLinks or compared
    scalar PCMCI targets with vector Self targets. Those fixtures were migrated to
    explicit components without weakening the fail-closed implementation.

