schema_version: 6

primary:
  discovery: pcmci_plus
  ci_test: parcorr
  forecaster: ridge
  horizon: 1
  tau_max: 10
  pc_alpha: 0.01
  conditions:
    - persistence
    - self
    - full
    - pcmci
    - lag_shift
    - random_region
    - matched_sparsity
    - time_shuffle
  lag_response:
    delta_frames: [-2, -1, 0, 1, 2]
    reference_delta: 0
    shift_mode: common_shift_all_selected_parents
    valid_lag_min: 1
    valid_lag_max: 10
    boundary_policy: mark_target_fold_unevaluable
    clipping: forbidden
    wrapping: forbidden
    feature_dropping: forbidden
    one_sided_grid: forbidden
    evaluability:
      require_complete_symmetric_grid: true
      empty_parent_set: unevaluable_no_parents
    aggregation:
      support: complete_grid_target_folds_only
      same_units_across_all_deltas: true
      report_unevaluable_counts: true
  matched_sparsity:
    repeat_count: 100
    seed_source: split_manifest_seed
    repeat_aggregation: median_error_across_repeats_per_subject_region
  statistics:
    paired_unit: subject
    point_aggregation: median
    bootstrap:
      confidence_level: 0.95
      n_resamples: 10000
      method: percentile
      seed_source: experiment_seed

discovery_representation:
  node_unit: region_dimension
  component_mapping: identity
  forecasting_feature_rule: exact_selected_component
  reporting_projection: region_lag

evaluation:
  split_unit: subject
  outer_test_usage: frozen_final_evaluation_only

selection_scope:
  preprocessing_fit: outer_train_only
  discovery: outer_train_only
  ridge_tuning: outer_train_only
  null_mapping: outer_train_only
  feature_selection: outer_train_only
  lag_selection: outer_train_only

sensitivity:
  execute_after_primary_freeze: true
  methods:
    - gpdc
    - lpcmci
    - phase_shuffled_surrogate
    - circular_shift_surrogate
    - horizon_gt_1
    - gru

artifacts:
  primary_root: artifacts/primary
  sensitivity_root: artifacts/sensitivity
