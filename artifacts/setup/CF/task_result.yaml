fail_history:
  initial_status: FAIL
  fail_types:
    - contract mismatch
    - scientific specification conflict
  root_cause: >-
    Scientific Freeze v2 defines scalar region_dimension PCMCI nodes and exact
    selected-component forecasting. Core contract v2 preserved component identity
    in ParentLink but DesignMatrix and PredictionArtifact still exposed only target
    region and target array values. A serialized scalar target therefore could not
    prove whether it represented vx, vy, or another component.
  minimal_fix: >-
    Version the core contracts to v3, add target_dimensions to DesignMatrix and
    PredictionArtifact, propagate that provenance through matrix construction,
    CV slicing, runner concatenation, fitted Ridge, prediction, and artifact
    serialization, and require explicit certified labels for v2-to-v3 migration.
  regression_history:
    - initial partial v3 migration exposed constructor and schema-version residues in CI
    - production propagation paths were repaired before fixture migration
    - legacy unit fixtures were migrated using known target labels only
    - regression reduced from 41 failures to 21 failures and then to 415 passing tests

