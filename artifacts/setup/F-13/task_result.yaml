implemented:
  - freezes delta_frames to [-2, -1, 0, 1, 2] with reference_delta=0
  - freezes shift_mode=common_shift_all_selected_parents
  - freezes valid lag domain to 1..10, consistent with h=1 and tau_max=10
  - forbids clipping, wrapping, feature dropping, and one-sided grids
  - marks the entire target-fold unevaluable when any required delta would leave lag domain 1..10
  - marks an empty ParentSet as unevaluable_no_parents
  - emits no partial grid for unevaluable target-folds
  - preserves source region, source component, target component, feature count, and common delta for every evaluable non-zero grid point
  - freezes aggregation support to complete_grid_target_folds_only, same units across all deltas, with unevaluable counts reported
  - keeps cross-fold lag-response aggregation implementation deferred to G-17; no downstream statistics code was implemented early
  - retains outer-train-only Null construction guard; no predictions, metrics, or outer-test outcomes enter grid construction

