migration:
  reason:
    - FaceTimeSeries Primary motion state is vector-valued per region, e.g. [vx, vy], while Tigramite ParCorr operates on scalar variables
    - the former region-only ParentSet lost component identity and caused a scientific contract mismatch
  scientific_config:
    from_schema_version: 1
    to_schema_version: 2
    frozen_rule:
      node_unit: region_dimension
      component_mapping: identity
      forecasting_feature_rule: exact_selected_component
      reporting_projection: region_lag
  core_contracts:
    from_schema_version: 1
    to_schema_version: 2
    impact_scope:
      - ParentLink component identity
      - ParentSet serialization
      - NullMapping serialization
      - PCMCI DesignMatrix construction
      - component-specific target semantics
    compatibility:
      - historical v1 registry is retained as migration history
      - ambiguous legacy component defaults are rejected for D>1 instead of silently scalarized

