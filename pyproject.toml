[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lagged-facial-graph-forecasting"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.7,<2",
  "scipy>=1.13,<2",
  "tigramite>=5.2.10.1,<5.3",
  "dcor>=0.6,<1",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "tabulate>=0.9,<1",
]
test = [
  "pytest>=8,<9",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "tabulate>=0.9,<1",
]
sensitivity = [
  "torch>=2.4,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
