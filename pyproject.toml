[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lagged-facial-graph-forecasting"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.7,<2",
  "scipy>=1.15,<2",
  "tigramite>=5.2.10.1,<5.3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
