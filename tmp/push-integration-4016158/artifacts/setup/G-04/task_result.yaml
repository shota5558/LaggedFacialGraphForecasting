task_id: G-04
task_name: Bootstrap 95% CI
status: PASS

implemented:
  - delegates generic bootstrap resampling to scipy.stats.bootstrap instead of reimplementing bootstrap machinery
  - computes two-sided 95% confidence intervals for the unweighted median of G-02 subject-level paired differences
  - preserves region, metric, comparison conditions, subject_ids, outer_folds, median, seed, method, and n_resamples in BootstrapMedianCI
  - requires at least two held-out subjects per aggregation group
  - makes n_resamples, seed, and bootstrap method explicit required arguments; no unfrozen analysis setting is silently defaulted
  - uses the scipy.stats.bootstrap random_state API so the implementation remains compatible below SciPy 1.15
  - sets scipy>=1.13,<2 because SciPy 1.13 is the first supported line compatible with the project's numpy>=2.0 floor
  - fails closed on unsupported method, invalid seed/resample count, and non-finite intervals

