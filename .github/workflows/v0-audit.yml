name: v0-vertical-slice-audit

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  v0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Test V0 tasks and gate
        run: >-
          pytest
          tests/test_synthetic_face_time_series.py
          tests/test_subject_split_builder.py
          tests/test_alignment.py
          tests/test_self_history_design_matrix.py
          tests/test_ridge_forecaster_fit.py
          tests/test_ridge_forecaster_prediction.py
          tests/test_velocity_rmse.py
          tests/test_v0_result_serialization.py
          tests/test_minimal_fold_runner.py
          tests/test_v0_end_to_end.py
