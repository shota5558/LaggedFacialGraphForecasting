name: p0b-contract-audit

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  p0b-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Test P0B contracts
        run: >-
          pytest
          tests/test_face_time_series.py
          tests/test_split_manifest.py
          tests/test_design_matrix.py
          tests/test_prediction_artifact.py
