name: sensitivity-torch-tests

on:
  push:
    branches: [dev]
    paths:
      - "src/lagged_facial_graph_forecasting/sensitivity_gru.py"
      - "src/lagged_facial_graph_forecasting/sensitivity_results.py"
      - "tests/test_sensitivity_gru.py"
      - "tests/test_sensitivity_integration_torch.py"
      - "pyproject.toml"
      - ".github/workflows/sensitivity-torch-test.yml"
  pull_request:
    paths:
      - "src/lagged_facial_graph_forecasting/sensitivity_gru.py"
      - "src/lagged_facial_graph_forecasting/sensitivity_results.py"
      - "tests/test_sensitivity_gru.py"
      - "tests/test_sensitivity_integration_torch.py"
      - "pyproject.toml"
      - ".github/workflows/sensitivity-torch-test.yml"

jobs:
  gru-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: GRU smoke and integration tests
        run: pytest tests/test_sensitivity_gru.py tests/test_sensitivity_integration_torch.py -q
